<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbf4ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="infra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ddd6fe"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e293b" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #475569; }
      .groupTitle { font: 700 20px Arial, sans-serif; fill: #0f172a; }
      .boxTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 14px Arial, sans-serif; fill: #334155; }
      .label { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="980" rx="24" fill="url(#bg)"/>

  <text x="800" y="56" text-anchor="middle" class="title">校园论坛系统架构图</text>
  <text x="800" y="84" text-anchor="middle" class="subtitle">微信小程序端、管理后台、Spring Boot 服务端、MySQL / Redis / Elasticsearch / 文件存储</text>

  <rect x="60" y="120" width="1480" height="170" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="90" y="155" class="groupTitle">客户端层</text>

  <rect x="110" y="178" width="300" height="86" rx="18" fill="url(#client)"/>
  <text x="260" y="212" text-anchor="middle" class="boxTitle">微信小程序端</text>
  <text x="260" y="236" text-anchor="middle" class="boxText">论坛 / 商品 / 互助 / 消息 / 个人中心</text>

  <rect x="450" y="178" width="300" height="86" rx="18" fill="url(#client)"/>
  <text x="600" y="212" text-anchor="middle" class="boxTitle">管理后台</text>
  <text x="600" y="236" text-anchor="middle" class="boxText">内容审核 / 用户管理 / 商品与系统管理</text>

  <rect x="790" y="178" width="300" height="86" rx="18" fill="url(#client)"/>
  <text x="940" y="212" text-anchor="middle" class="boxTitle">Web 管理接口</text>
  <text x="940" y="236" text-anchor="middle" class="boxText">Vue3 + Vite + API 代理</text>

  <rect x="1130" y="178" width="300" height="86" rx="18" fill="url(#client)"/>
  <text x="1280" y="212" text-anchor="middle" class="boxTitle">外部访问入口</text>
  <text x="1280" y="236" text-anchor="middle" class="boxText">统一 API 前缀 /api</text>

  <path d="M260 268 L260 320" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 268 L600 320" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M940 268 L940 320" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1280 268 L1280 320" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="60" y="330" width="1480" height="300" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="90" y="365" class="groupTitle">接入与业务层</text>

  <rect x="120" y="395" width="220" height="110" rx="18" fill="url(#api)"/>
  <text x="230" y="430" text-anchor="middle" class="boxTitle">Spring Boot API</text>
  <text x="230" y="454" text-anchor="middle" class="boxText">REST 接口 / 参数校验</text>
  <text x="230" y="476" text-anchor="middle" class="boxText">统一返回 Result / PageResult</text>

  <rect x="380" y="395" width="220" height="110" rx="18" fill="url(#api)"/>
  <text x="490" y="430" text-anchor="middle" class="boxTitle">JWT 安全层</text>
  <text x="490" y="454" text-anchor="middle" class="boxText">登录认证 / 权限控制</text>
  <text x="490" y="476" text-anchor="middle" class="boxText">Token 解析 / 鉴权拦截</text>

  <rect x="640" y="395" width="220" height="110" rx="18" fill="url(#service)"/>
  <text x="750" y="430" text-anchor="middle" class="boxTitle">论坛服务</text>
  <text x="750" y="454" text-anchor="middle" class="boxText">帖子 / 评论 / 点赞 / 收藏</text>
  <text x="750" y="476" text-anchor="middle" class="boxText">个人帖子 / 热帖 / 审核</text>

  <rect x="900" y="395" width="220" height="110" rx="18" fill="url(#service)"/>
  <text x="1010" y="430" text-anchor="middle" class="boxTitle">服务交易服务</text>
  <text x="1010" y="454" text-anchor="middle" class="boxText">商品 / 订单 / 约见 / 核销</text>
  <text x="1010" y="476" text-anchor="middle" class="boxText">失物 / 互助 / 活动</text>

  <rect x="1160" y="395" width="220" height="110" rx="18" fill="url(#service)"/>
  <text x="1270" y="430" text-anchor="middle" class="boxTitle">用户与消息</text>
  <text x="1270" y="454" text-anchor="middle" class="boxText">个人中心 / 钱包 / 关注</text>
  <text x="1270" y="476" text-anchor="middle" class="boxText">通知 / 聊天 / 站内信</text>

  <path d="M230 505 C230 545, 400 545, 400 505" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 505 C490 545, 650 545, 650 505" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 505 C750 545, 910 545, 910 505" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1010 505 C1010 545, 1170 545, 1170 505" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="650" width="1480" height="250" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="90" y="685" class="groupTitle">基础设施层</text>

  <rect x="120" y="720" width="250" height="120" rx="18" fill="url(#infra)"/>
  <text x="245" y="758" text-anchor="middle" class="boxTitle">MySQL</text>
  <text x="245" y="782" text-anchor="middle" class="boxText">用户 / 帖子 / 商品 / 订单</text>
  <text x="245" y="804" text-anchor="middle" class="boxText">审核 / 互动 / 统计</text>

  <rect x="420" y="720" width="250" height="120" rx="18" fill="url(#infra)"/>
  <text x="545" y="758" text-anchor="middle" class="boxTitle">Redis</text>
  <text x="545" y="782" text-anchor="middle" class="boxText">验证码 / 会话 / 缓存</text>
  <text x="545" y="804" text-anchor="middle" class="boxText">热点数据 / 临时状态</text>

  <rect x="720" y="720" width="250" height="120" rx="18" fill="url(#infra)"/>
  <text x="845" y="758" text-anchor="middle" class="boxTitle">Elasticsearch</text>
  <text x="845" y="782" text-anchor="middle" class="boxText">全文检索 / 搜索推荐</text>
  <text x="845" y="804" text-anchor="middle" class="boxText">帖子 / 商品 / 服务内容</text>

  <rect x="1020" y="720" width="250" height="120" rx="18" fill="url(#infra)"/>
  <text x="1145" y="758" text-anchor="middle" class="boxTitle">文件存储</text>
  <text x="1145" y="782" text-anchor="middle" class="boxText">上传图片 / 附件 / 头像</text>
  <text x="1145" y="804" text-anchor="middle" class="boxText">uploads 目录</text>

  <path d="M750 615 L245 720" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 615 L545 720" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1010 615 L845 720" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1270 615 L1145 720" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="1340" y="920" class="small">说明：微信小程序与管理后台统一调用 Spring Boot REST 接口，核心数据落 MySQL，搜索走 Elasticsearch，临时状态与缓存走 Redis。</text>
</svg>